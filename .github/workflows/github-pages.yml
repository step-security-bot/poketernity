name: "Github Pages"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - beta
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  pages:
    permissions:
      contents: write  # for Git to git push
    name: Github Pages
    if: github.repository == 'despair-games/poketernity'
    runs-on: ubuntu-latest
    env:
      api-dir: ./

    strategy:
      fail-fast: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository for Typedoc
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          submodules: "recursive"
          path: poketernity_docs

      - name: Setup Node 20.13.1
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 20

      - name: Checkout repository for Github Pages
        if: github.event_name == 'push'
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          path: poketernity_gh
          ref: gh-pages

      - name: Install Node.js dependencies
        working-directory: ${{env.api-dir}}
        run: |
          cd poketernity_docs
          npm ci

      - name: Generate Typedoc docs
        working-directory: ${{env.api-dir}}
        run: |
          cd poketernity_docs
          npm run docs -- --out /tmp/docs --githubPages false --entryPoints ./src/

      - name: Commit & Push docs
        if: github.event_name == 'push'
        run: |
          cd poketernity_gh
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          mkdir -p $GITHUB_REF_NAME
          rm -rf $GITHUB_REF_NAME/*
          cp -r /tmp/docs/. $GITHUB_REF_NAME
          git add $GITHUB_REF_NAME
          git commit --allow-empty -m "[skip ci] Deploy docs"
          git push
